[project]
name = "personal-research-agent"
version = "0.1.0"
description = "Personalized, budget-bounded, resumable research agent (pra CLI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",
    "pypdf>=4",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pra = "personal_research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_research_agent"]
