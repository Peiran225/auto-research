taste_rules:
  # Conditional preferences inferred from discussion; not trained, not confirmed rule by rule.
  - id: TR1
    rule: prefer candidates with an explicit mechanism over purely empirical improvements
    applies_when: two candidates are otherwise tied on scientific value and feasibility
    source: inferred_from_discussion
    confirmed_by_user: false
  - id: TR2
    rule: prefer comparisons under aligned conditions (same data, budget, policy class)
    applies_when: choosing a validation protocol
    source: inferred_from_discussion
    confirmed_by_user: false
  - id: TR3
    rule: prefer claims whose scope matches the available evidence
    applies_when: deciding how broadly to state a result
    source: inferred_from_discussion
    confirmed_by_user: false
  - id: TR4
    rule: prefer results that guide later choices (conditions, counterexamples) over isolated numbers
    applies_when: two candidates are otherwise tied
    source: inferred_from_discussion
    confirmed_by_user: false
